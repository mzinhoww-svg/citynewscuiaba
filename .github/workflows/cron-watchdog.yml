name: Cron watchdog

# ADR-003: o pg_cron chama o tick a cada 30 min e o drain a cada minuto enquanto houver fila.
# Este vigia roda a cada 15 min e cobre as falhas dos dois (P3-T9):
# 1. consulta /api/ingest/status (último início do ciclo e mensagens na fila);
# 2. dispara o tick se o último ingest_runs.started_at tiver mais de 45 min;
# 3. dispara o tick rápido (/api/ingest/fast-tick) se houver fonte rápida ativa e o último run
#    `fast` tiver mais de 15 min (o pg_cron o chama a cada 10 min);
# 4. chama /api/jobs/drain enquanto houver fila pendente — sem pg_net (pilha sem Vault, projeto
#    novo) nada mais dispara o drain (inclui a fila gerada pelo tick rápido).
# Secrets ausentes: aviso e saída 0. Rotas ainda não publicadas (404): aviso, sem falhar.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: cron-watchdog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Conferir o ciclo, disparar o tick se estiver atrasado e drenar a fila
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MAX_AGE_MIN: "45"
          FAST_MAX_AGE_MIN: "15"
          MAX_DRAINS: "4"
        run: |
          set -euo pipefail
          missing=""
          for name in APP_URL CRON_SECRET; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::Secrets ausentes:$missing. Watchdog não executado."
            exit 0
          fi
          app="${APP_URL%/}"
          auth="Authorization: Bearer $CRON_SECRET"
          body=$(mktemp)

          # Fallback quando /api/ingest/status não responde: consulta direta ao Supabase (opcional).
          rest() {
            if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
              echo "skip"
              return 0
            fi
            curl -sS -o "$body" -w '%{http_code}' --max-time 20 \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "${SUPABASE_URL%/}/rest/v1/$1" || echo "000"
          }

          late="unknown"
          fast_late="false"
          fast_sources="0"
          pending="unknown"
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 30 -H "$auth" "$app/api/ingest/status" || echo "000")
          case "$code" in
            200)
              late=$(jq -r '.late' "$body")
              pending=$(jq -r '.pending.total // 0' "$body")
              fast_late=$(jq -r '.fast.late // false' "$body")
              fast_sources=$(jq -r '.fast.sources // 0' "$body")
              echo "Status: último início $(jq -r '.lastStartedAt // "nenhum"' "$body"), atrasado=$late, via rápida atrasada=$fast_late ($fast_sources fontes), fila=$pending."
              ;;
            401|403)
              echo "::error::/api/ingest/status recusou o CRON_SECRET (HTTP $code)."
              exit 1
              ;;
            *)
              echo "::warning::/api/ingest/status devolveu HTTP $code; tentando a consulta direta ao Supabase."
              if [ "$(rest "ingest_runs?select=started_at&trigger=eq.cron&order=started_at.desc&limit=1")" = "200" ]; then
                last=$(jq -r '.[0].started_at // empty' "$body")
                if [ -z "$last" ]; then
                  late="true"
                else
                  age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
                  if [ "$age" -gt "$MAX_AGE_MIN" ]; then late="true"; else late="false"; fi
                fi
              fi
              # Via rápida: fontes ativas com frequência < 30 min e o último run `fast`.
              if [ "$(rest "sources?select=id&frequency_minutes=lt.30&archived_at=is.null&status=in.(active,degraded)&limit=1")" = "200" ]; then
                fast_sources=$(jq 'length' "$body")
              fi
              if [ "$fast_sources" != "0" ] && [ "$(rest "ingest_runs?select=started_at&trigger=eq.fast&order=started_at.desc&limit=1")" = "200" ]; then
                last=$(jq -r '.[0].started_at // empty' "$body")
                if [ -z "$last" ]; then
                  fast_late="true"
                else
                  age=$(( ($(date -u +%s) - $(date -u -d "$last" +%s)) / 60 ))
                  if [ "$age" -gt "$FAST_MAX_AGE_MIN" ]; then fast_late="true"; else fast_late="false"; fi
                fi
              fi
              if [ "$(rest "jobs?select=id&limit=1")" = "200" ]; then
                pending=$(jq 'length' "$body")
              fi
              ;;
          esac

          if [ "$late" != "false" ]; then
            code=$(curl -sS -o "$body" -w '%{http_code}' -X POST --max-time 60 -H "$auth" "$app/api/ingest/tick" || echo "000")
            case "$code" in
              2??)
                echo "Tick disparado pelo watchdog (HTTP $code): $(head -c 300 "$body")"
                pending="unknown"
                ;;
              404) echo "::warning::/api/ingest/tick ainda não existe (HTTP 404); nada a fazer." ;;
              *)
                echo "::error::Tick devolveu HTTP $code"
                head -c 500 "$body" || true
                exit 1
                ;;
            esac
          else
            echo "Ciclo em dia."
          fi

          if [ "$fast_late" = "true" ] && [ "$fast_sources" != "0" ]; then
            code=$(curl -sS -o "$body" -w '%{http_code}' -X POST --max-time 60 -H "$auth" "$app/api/ingest/fast-tick" || echo "000")
            case "$code" in
              2??)
                echo "Tick rápido disparado pelo watchdog (HTTP $code): $(head -c 300 "$body")"
                pending="unknown"
                ;;
              404) echo "::warning::/api/ingest/fast-tick ainda não existe (HTTP 404); nada a fazer." ;;
              *)
                echo "::error::Tick rápido devolveu HTTP $code"
                head -c 500 "$body" || true
                exit 1
                ;;
            esac
          fi

          if [ "$pending" = "0" ]; then
            echo "Fila vazia; drain não chamado."
            exit 0
          fi
          for i in $(seq 1 "$MAX_DRAINS"); do
            code=$(curl -sS -o "$body" -w '%{http_code}' -X POST --max-time 75 -H "$auth" "$app/api/jobs/drain" || echo "000")
            case "$code" in
              200)
                processed=$(jq -r '.processed // 0' "$body")
                remaining=$(jq -r '.remaining // 0' "$body")
                echo "Drain $i: processadas $processed, restantes $remaining."
                # Fila vazia, ou só mensagens esperando nova tentativa (não ficam prontas agora).
                if [ "$remaining" = "0" ] || [ "$processed" = "0" ]; then break; fi
                ;;
              404)
                echo "::warning::/api/jobs/drain ainda não existe (HTTP 404); nada a fazer."
                break
                ;;
              *)
                echo "::warning::Drain devolveu HTTP $code"
                head -c 500 "$body" || true
                break
                ;;
            esac
          done
