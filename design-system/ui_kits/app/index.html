<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>CityNews — App UI kit</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--cn-papel);min-height:100vh}.jump{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.jump button{border:0;background:#fff;border-radius:999px;height:28px;padding:0 12px;font:500 12px var(--font-sans);color:var(--cn-grafite);cursor:pointer}.jump button.on{background:var(--cn-tinta);color:#fff}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Shell.jsx"></script>
<script type="text/babel" src="AuthScreens.jsx"></script>
<script type="text/babel" src="FeedScreens.jsx"></script>
<script type="text/babel" src="DetailScreens.jsx"></script>
<script type="text/babel">
function App() {
  const [screen, setScreen] = React.useState(localStorage.getItem('cn-app-screen') || 'home');
  const [story, setStory] = React.useState(appData.explore[0]);
  const go = (s) => { setScreen(s); localStorage.setItem('cn-app-screen', s); };
  const open = (s) => { setStory(s); go('article'); };
  const tabProps = { tab: screen, setTab: go, onOpen: open };
  const views = {
    splash: <SplashScreen onNext={() => go('login')} />,
    login: <LoginScreen onLogin={() => go('home')} />,
    home: <HomeScreen {...tabProps} />,
    search: <SearchScreen {...tabProps} />,
    saved: <SavedScreen {...tabProps} />,
    profile: <ProfileScreen {...tabProps} onLogout={() => go('splash')} />,
    article: <ArticleScreen story={story} onBack={() => go('home')} />,
  };
  const labels = { splash: 'Abertura', login: 'Login', home: 'Início', search: 'Buscar', saved: 'Salvos', article: 'Matéria', profile: 'Configurações' };
  return <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 22, padding: '24px 16px 40px' }}>
    <div className="jump">{Object.keys(labels).map((k) => <button key={k} className={k === screen ? 'on' : ''} onClick={() => go(k)}>{labels[k]}</button>)}</div>
    {views[screen] || views.home}
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script></body></html>
