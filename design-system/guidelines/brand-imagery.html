<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:84px;border-radius:8px;border:1px solid rgba(15,27,45,.08)}.n{font:700 13px/1.2 var(--font-sans);margin-top:8px}.h{font:400 11px/1.3 var(--font-sans);color:var(--text-meta);margin-top:2px}.lab{font:600 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text-meta)}</style></head><body><div class="row"><div style="flex:2;height:130px;border-radius:16px;background:var(--surface-photo);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text-meta)">Foto da reportagem principal</div><div style="flex:1;height:130px;border-radius:16px;background:var(--surface-photo);position:relative;overflow:hidden"><div style="position:absolute;inset:auto 0 0 0;height:70%;background:linear-gradient(transparent,rgba(15,27,45,.85))"></div><div style="position:absolute;left:12px;bottom:12px;right:12px;color:#fff;font:600 14px/1.25 var(--font-serif)">Protection gradient for text on photo</div></div></div></body></html>
