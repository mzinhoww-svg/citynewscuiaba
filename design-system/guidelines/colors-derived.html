<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:56px;height:84px;border-radius:8px;border:1px solid rgba(15,27,45,.08)}.n{font:700 13px/1.2 var(--font-sans);margin-top:8px}.h{font:400 11px/1.3 var(--font-sans);color:var(--text-meta);margin-top:2px}.lab{font:600 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text-meta)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cn-tinta-80)"></div><div class="n">tinta-80</div><div class="h">pressed</div></div><div class="sw"><div class="chip" style="background:var(--cn-urucum-soft)"></div><div class="n">urucum-soft</div><div class="h">live bg</div></div><div class="sw"><div class="chip" style="background:var(--cn-cerrado-soft)"></div><div class="n">cerrado-soft</div><div class="h">guia bg</div></div><div class="sw"><div class="chip" style="background:var(--cn-papel-2)"></div><div class="n">papel-2</div><div class="h">fill pressed</div></div><div class="sw"><div class="chip" style="background:var(--cn-foto)"></div><div class="n">foto</div><div class="h">placeholder</div></div><div class="sw"><div class="chip" style="background:var(--cn-linha)"></div><div class="n">linha</div><div class="h">hairline</div></div><div class="sw"><div class="chip" style="background:var(--cn-erro)"></div><div class="n">erro</div><div class="h">danger</div></div></div></body></html>
