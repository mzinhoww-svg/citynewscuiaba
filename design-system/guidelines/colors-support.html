<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;font-family:var(--font-sans);color:var(--text-body);background:#fff}.row{display:flex;gap:12px}.sw{flex:1;min-width:0}.chip{height:84px;border-radius:8px;border:1px solid rgba(15,27,45,.08)}.n{font:700 13px/1.2 var(--font-sans);margin-top:8px}.h{font:400 11px/1.3 var(--font-sans);color:var(--text-meta);margin-top:2px}.lab{font:600 11px/1 var(--font-sans);letter-spacing:.08em;text-transform:uppercase;color:var(--text-meta)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--cn-cerrado)"></div><div class="n">Cerrado</div><div class="h">#1E6B52 · guia, serviços</div></div><div class="sw"><div class="chip" style="background:var(--cn-papel)"></div><div class="n">Papel</div><div class="h">#F5F2EC · seções, agenda</div></div><div class="sw"><div class="chip" style="background:var(--cn-grafite)"></div><div class="n">Grafite</div><div class="h">#4A4F57 · metadados</div></div></div></body></html>
